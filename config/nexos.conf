{
  "_comment": "NexOS Configuration File — do not edit manually unless you know what you are doing.",
  "_version": "0.1.0-demo",

  "appearance": {
    "theme": "blue",
    "taskbarStyle": "win12",
    "wallpaper": {
      "type": "gradient",
      "imagePath": "",
      "videoUrl": "",
      "gradient": "linear-gradient(135deg, #0d0d2b 0%, #1a1a4e 30%, #0d1b3e 60%, #050510 100%)",
      "blur": false,
      "blurAmount": 10
    },
    "accentColor": "#4a9eff",
    "iconSize": 48,
    "taskbarHeight": 60,
    "taskbarOpacity": 0.75,
    "animationsEnabled": true,
    "glassmorphismEnabled": true,
    "roundedCorners": true,
    "cornerRadius": 16,
    "shadowsEnabled": true,
    "dockEnabled": true,
    "dockStyle": "plank",
    "cursorTheme": "default",
    "iconTheme": "nexos-default"
  },

  "display": {
    "resolution": "auto",
    "refreshRate": "auto",
    "scaling": 1.0,
    "nightLight": false,
    "nightLightTemp": 4500,
    "gpuDetected": "",
    "gpuType": "auto",
    "integratedGraphics": false,
    "vsync": true,
    "hdr": false
  },

  "performance": {
    "gamingMode": false,
    "cpuGovernor": "schedutil",
    "cpuGovernorGaming": "performance",
    "backgroundAppLimit": true,
    "maxBackgroundApps": 10,
    "ramOptimizer": false,
    "swappiness": 60,
    "swappinessGaming": 10,
    "ioScheduler": "bfq",
    "preloadEnabled": false
  },

  "compatibility": {
    "wineEnabled": true,
    "winePrefix": "~/.wine",
    "wineArch": "win64",
    "wineDllOverrides": "mscoree,mshtml=",
    "wineDebugLevel": "fixme-all",
    "waydroidEnabled": false,
    "waydroidGapps": false,
    "darlingEnabled": false,
    "exeFileHandler": "wine",
    "apkFileHandler": "waydroid",
    "dmgFileHandler": "darling"
  },

  "system": {
    "hostname": "nexos",
    "timezone": "UTC",
    "locale": "en_US.UTF-8",
    "autoLogin": true,
    "autoLoginUser": "nexos",
    "sessionType": "openbox",
    "networkManager": true,
    "bluetoothEnabled": false,
    "sshEnabled": false,
    "firewallEnabled": false
  },

  "audio": {
    "server": "pulseaudio",
    "volume": 80,
    "micVolume": 70,
    "muteOnStartup": false,
    "outputDevice": "auto",
    "inputDevice": "auto"
  },

  "launcher": {
    "style": "grid",
    "columns": 6,
    "showRecent": true,
    "recentCount": 6,
    "searchEnabled": true,
    "categories": true,
    "pinnedApps": [
      "files",
      "terminal",
      "settings",
      "browser",
      "text-editor"
    ]
  },

  "notifications": {
    "enabled": true,
    "position": "top-right",
    "timeout": 5000,
    "doNotDisturb": false,
    "doNotDisturbStart": "22:00",
    "doNotDisturbEnd": "08:00"
  },

  "advanced": {
    "showAdvancedSettings": false,
    "kernelParams": "quiet splash loglevel=3",
    "bootFlags": "",
    "developerMode": false,
    "experimentalFeatures": false,
    "electronicLogging": false,
    "rawConfigEditorEnabled": false,
    "systemCallsMonitor": false,
    "waydroidLogLevel": "info",
    "compositorBackend": "glx",
    "compositorBlur": true,
    "compositorBlurMethod": "dual_kawase",
    "compositorBlurStrength": 7
  },

  "security": {
    "requirePasscode": false,
    "passcode": "1234",
    "lockOnStartup": false,
    "autoLockTimeout": 0
  },

  "updates": {
    "autoCheck": true,
    "repoUrl": "https://github.com/JJSFraud/nexos",
    "channel": "main",
    "preserveUserFiles": true,
    "preserveCustomizations": true
  }
}
