# =============================================================================
# NexOS GRUB Bootloader Configuration
# =============================================================================

set default=0
set timeout=7
set timeout_style=menu

# Load modules needed for graphics and themes
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
insmod font
insmod loadenv

# Set console terminal fallback
if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=auto
    insmod gfxterm
    terminal_output gfxterm
fi

# Background colour (dark blue — matches NexOS theme)
background_color 10,10,26

# ---------------------------------------------------------------------------
# Main boot entry
# ---------------------------------------------------------------------------
menuentry "NexOS 0.1.0-demo" --class nexos --class gnu-linux --class os --id "nexos-live" {
    echo "Loading NexOS kernel..."
    linux  /live/vmlinuz boot=live \
           quiet splash \
           loglevel=3 \
           rd.systemd.show_status=auto \
           rd.udev.log_level=3 \
           fsck.mode=skip \
           mitigations=off \
           noefi \
           nomodeset=0 \
           apparmor=1 security=apparmor \
           hostname=nexos \
           username=nexos \
           user-fullname="NexOS User" \
           timezone=UTC \
           locales=en_US.UTF-8 \
           keyboard-layouts=us

    echo "Loading initial ramdisk..."
    initrd /live/initrd.img
}

# ---------------------------------------------------------------------------
# Recovery / safe mode entry
# ---------------------------------------------------------------------------
menuentry "NexOS (Recovery Mode)" --class nexos --class gnu-linux --id "nexos-recovery" {
    echo "Booting NexOS Recovery Mode..."
    linux  /live/vmlinuz boot=live \
           single \
           noefi \
           nomodeset \
           hostname=nexos \
           username=nexos

    initrd /live/initrd.img
}

# ---------------------------------------------------------------------------
# Verbose / debug entry
# ---------------------------------------------------------------------------
menuentry "NexOS (Verbose Boot — Debug)" --class nexos --id "nexos-debug" {
    linux  /live/vmlinuz boot=live \
           loglevel=7 \
           hostname=nexos \
           username=nexos

    initrd /live/initrd.img
}

# ---------------------------------------------------------------------------
# Hardware test
# ---------------------------------------------------------------------------
menuentry "Memory Test (memtest86+)" --class memtest86 --id "memtest" {
    linux16 /boot/memtest86+x64.bin
}

# ---------------------------------------------------------------------------
# Boot from hard disk
# ---------------------------------------------------------------------------
menuentry "Boot from first hard disk" --class hd --id "hdd" {
    insmod chain
    set root=(hd0)
    chainloader +1
}

# ---------------------------------------------------------------------------
# Reboot / Shutdown
# ---------------------------------------------------------------------------
menuentry "Reboot" --class restart --id "reboot" {
    echo "Rebooting..."
    reboot
}

menuentry "Shutdown" --class shutdown --id "shutdown" {
    echo "Shutting down..."
    halt
}
